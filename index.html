<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FONO 汉语 — Atlas sonoro do mandarim</title><style>body{font:16px system-ui,sans-serif;background:#f7f6f1;color:#222;max-width:42rem;margin:15vh auto;padding:24px}h1{font-size:2rem}progress{width:100%;accent-color:#b99d00}button{font:inherit;padding:8px 12px}</style></head><body><h1>FONO 汉语</h1><p id="msg" role="status">Carregando biblioteca sonora completa…</p><progress id="p" max="9" value="0"></progress><p><button onclick="location.reload()" hidden id="retry">Tentar novamente</button></p><noscript>Ative o JavaScript para usar a biblioteca.</noscript><script>(async()=>{try{let done=0;const parts=await Promise.all(Array.from({length:9},(_,i)=>fetch(new URL("parts/"+i+".txt",location.href)).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.arrayBuffer()}).then(b=>{document.getElementById("p").value=++done;return new Uint8Array(b)})));let bytes=new Uint8Array(parts.reduce((n,p)=>n+p.length,0)),o=0;for(const p of parts){bytes.set(p,o);o+=p.length}if(bytes.length!==8229736)throw Error("Tamanho inesperado");if(!crypto.subtle)throw Error("HTTPS necessário");const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),b=>b.toString(16).padStart(2,"0")).join("");if(hash!=="b9f0c932811e35727ee504bad21c160ba0f2c951734fa63737de43b7414c0690")throw Error("Verificação de integridade falhou");const html=new TextDecoder("utf-8",{fatal:true}).decode(bytes);document.open();document.write(html);document.close()}catch(e){document.getElementById("msg").textContent="Não foi possível carregar a biblioteca: "+e.message;document.getElementById("retry").hidden=false}})();</script></body></html>
